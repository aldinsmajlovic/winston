# Winston: one file selects every swappable component (WINSTON_PLAN.md §6, rule 1).
# Values are the September 2026 defaults from plan §3. Before installing anything,
# re-check each model still exists and is supported by the serving stack; exact
# Hugging Face ids and quant repos still need verifying. Secrets never go here (.env).

persona:
  name: Winston
  prompt: brain/prompts/persona.md

stt:
  provider: parakeet              # NVIDIA Parakeet TDT 0.6B v3 via onnx-asr, INT8 on CPU (keeps GPU free)
  model: nemo-parakeet-tdt-0.6b-v3
  quantization: int8

llm:
  provider: openai_compatible     # vLLM, see ops/docker-compose.yml (parsers: qwen3 reasoning, qwen3_coder tools)
  base_url: http://127.0.0.1:8000/v1
  model: QuantTrio/Qwen3.5-9B-AWQ # M0 verified 2026-09-22; ~11.4 GB weights on the 3090
  max_tokens: 512
  enable_thinking: false          # voice: thinking costs seconds a spoken reply cannot spend
  enable_thinking_text: true      # cli/telegram: thinking makes the 9B handle multi-part requests reliably (~+3 s)
  temperature: 0.3                # lower than Qwen's chat default (0.7): tool calls must be reliable, not creative
  top_p: 0.8
  top_k: 20
  presence_penalty: 0.0           # Qwen suggests 1.5 for chat; it made the 9B announce actions instead of calling tools

tts:
  provider: chatterbox_turbo      # served by voice/tts/chatterbox_server (own venv, GPU)
  server_url: http://127.0.0.1:8880/v1
  voice: onyx                     # any OpenAI voice name maps to the server's --voice clip (Pipecat's client validates names)
  reference_voice: voice/tts/reference/vctk/p254_023.wav  # VCTK p254, CC BY 4.0; swap for a consented custom clip later

vad:
  provider: silero
  barge_in: true
  stop_secs: 0.3                  # silence after speech before the utterance is sent to STT

wake_word:
  provider: openwakeword
  model: satellite/models/hey_winston.onnx  # custom-trained; no pretrained "Hey Winston" exists
  threshold: 0.5

home_assistant:
  url_env: HA_URL
  token_env: HA_TOKEN
  mcp_path: /api/mcp                # HA 2026.7 serves the chosen LLM API here (no /assist suffix)

cloud:                            # ask_claude tool (plan M4). Only the question text leaves the LAN.
  provider: anthropic
  model: claude-opus-5
  api_key_env: ANTHROPIC_API_KEY
  max_tokens: 2048
  daily_cap_usd: 1.50             # roughly 500 SEK/month; adjust to the exchange rate

channels:
  telegram:
    enabled: false
    token_env: TELEGRAM_BOT_TOKEN
    allowed_user_id_env: TELEGRAM_ALLOWED_USER_ID

memory:
  vault: memory/
  commit_on_write: true

logging:
  tool_calls: logs/tool_calls.jsonl   # plan §6 rule 7
  latency: logs/latency.jsonl         # plan §6 rule 8
