[project]
name = "winston-sdk"
version = "1.0.0a4"
description = "Write extensions for Winston, the self-hosted voice assistant for Home Assistant"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.2",
    "httpx>=0.27",
    "pydantic>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/winston_sdk"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
# The same rules as Winston's own pyproject.toml.
extend-select = ["BLE001", "E402", "E731"]
ignore = ["I001"]
