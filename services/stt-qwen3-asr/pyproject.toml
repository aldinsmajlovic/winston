[project]
name = "winston-stt-qwen3-asr"
version = "0.1.0"
description = "Winston STT engine: OpenAI-compatible /v1/audio/transcriptions server for Qwen3-ASR"
requires-python = ">=3.12,<3.13"
dependencies = [
    "qwen-asr",                 # Qwen's own runner (transformers backend)
    "torch>=2.8",               # listed directly so the CUDA index below applies
    "fastapi>=0.115",
    "python-multipart>=0.0.9",  # FastAPI's form uploads
    "uvicorn>=0.30",
    "numpy",
    "soundfile",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
