[project]
name = "winston-tts-chatterbox"
version = "0.1.0"
description = "OpenAI-compatible /v1/audio/speech server for Chatterbox-Turbo (Winston TTS adapter)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "chatterbox-tts>=0.1.7",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "numpy",
    "setuptools<81",  # perth watermarker imports pkg_resources, removed from setuptools 81+
]

[tool.uv]
package = false

[tool.winston]
# The venv on disk, measured 2026-10-23 (du); measure again when uv.lock changes.
installed-gb = 6.3
