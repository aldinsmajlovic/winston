[project]
name = "winston-tts-qwen3"
version = "0.1.0"
description = "Benchmark candidate: OpenAI-compatible /v1/audio/speech server for Qwen3-TTS 1.7B Base"
requires-python = ">=3.12,<3.13"
dependencies = [
    "qwen-tts==0.1.1",          # pins transformers 4.57.3 and accelerate 1.12.0
    "torch>=2.8",               # listed directly so the CUDA index below applies
    "torchaudio>=2.8",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "numpy",
    "soundfile",
    "onnx-asr[cpu,hub]>=0.12.0", # transcribes a reference clip once, for cloning with its words
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
