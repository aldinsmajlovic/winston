# Voice PE firmware with "Okay Winston": the official factory firmware at a pinned release, plus
# the okay_winston microWakeWord model from assets/wake/, hold to talk, no Wi-Fi modem sleep and barge-in. Everything
# else (Wi-Fi setup over USB and Bluetooth, LEDs, dial, mute switch, media player) is the stock firmware.
# See docs/voice-pe.md.
#
#   uvx esphome@2026.9.1 compile voice-pe-winston.yaml
#   uvx esphome@2026.9.1 upload voice-pe-winston.yaml --device /dev/ttyACM0
packages:
  voice_pe: github://esphome/home-assistant-voice-pe/home-assistant-voice.factory.yaml@26.9.0

esphome:
  project:
    name: Nabu Casa.Home Assistant Voice PE
    version: 26.9.0-winston

# Barge-in: ESPHome's voice_assistant from the release this builds with (2026.9.1, hence the pinned esphome
# below), changed only where it says "Winston:". The microphone stays on after the end of the request and its
# echo-cancelled audio keeps going to Winston while he thinks and talks; he stops the reply when he hears you.
# Home Assistant as the client would get that audio too and has no use for it.
external_components:
  - source:
      type: local
      path: components
    components: [voice_assistant]

micro_wake_word:
  models:
    - model: ../../assets/wake/okay_winston.json
      id: okay_winston

# No Wi-Fi modem sleep while connected: asleep, the box woke for packets only every ~307 ms (DTIM 3), so
# it heard tts_start_streaming up to ~300 ms late (mean ~140 ms) and every reply started that much later.
# ESPHome appends these to the factory's lists, so the request runs after its 5 s delay and ble.disable
# (Bluetooth wants modem sleep), and the release keeps the count balanced when it re-enables Bluetooth.
# A drop during that delay skips the request, else it would outlive the release.
wifi:
  on_connect:
    - lambda: if (wifi::global_wifi_component->is_connected()) wifi::global_wifi_component->request_high_performance();
  on_disconnect:
    - lambda: wifi::global_wifi_component->release_high_performance();

# The stock "Wake word sensitivity" select only sets the three stock models, so Okay Winston stayed at its
# manifest's 0.95 whatever it said. This replaces its lambda: the stock values as they were, plus Okay
# Winston at 0.95, 0.85 and 0.70 (the trainer measured no false accepts per hour down to 0.92 and 0.19
# at 0.46 on its ambient set; real rooms are noisier). Winston sets it per box (wake_sensitivity).
select:
  - id: !extend wake_word_sensitivity
    on_value:
      lambda: |-
        if (x == "Slightly sensitive") {
          id(okay_nabu).set_probability_cutoff(217);    // 0.85
          id(hey_jarvis).set_probability_cutoff(247);   // 0.97
          id(hey_mycroft).set_probability_cutoff(253);  // 0.99
          id(okay_winston).set_probability_cutoff(242); // 0.95 (the manifest's)
        } else if (x == "Moderately sensitive") {
          id(okay_nabu).set_probability_cutoff(176);    // 0.69
          id(hey_jarvis).set_probability_cutoff(235);   // 0.92
          id(hey_mycroft).set_probability_cutoff(242);  // 0.95
          id(okay_winston).set_probability_cutoff(217); // 0.85
        } else if (x == "Very sensitive") {
          id(okay_nabu).set_probability_cutoff(143);    // 0.56
          id(hey_jarvis).set_probability_cutoff(212);   // 0.83
          id(hey_mycroft).set_probability_cutoff(237);  // 0.93
          id(okay_winston).set_probability_cutoff(179); // 0.70
        }

# Hold to talk. The stock long press (a second) starts a request without the box's silence detection,
# which Winston reads as "ends when the button is let go" (the USE_VAD flag is off). voice_assistant.stop
# would abort the run (the box goes idle and plays no reply), so the box only reports the button and
# Winston ends the request. Naming center_button exposes it; it was internal.
# The stock factory reset (a warning at 10 s, the reset on letting go after 22 s) is skipped while
# dial_touched is set, as when the dial is used with the button; a hold to talk sets it too, so a long
# request never resets the box. Muted, a hold does not talk, so the reset still works there.
binary_sensor:
  - id: !extend center_button
    name: Center button
    on_release:
      - lambda: id(dial_touched) = false;
      - script.execute: control_leds

event:
  - id: !extend button_press_event
    on_event:
      - if:
          condition:
            and:
              - lambda: return event_type == "long_press";
              - switch.is_off: master_mute_switch
              - not: voice_assistant.is_running
          then:
            - lambda: id(dial_touched) = true;
            - voice_assistant.start:
                silence_detection: false
