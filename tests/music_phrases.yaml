# Music requests for `winston check turns --phrases tests/music_phrases.yaml --runs 5`: what the box's
# brain calls for each, with the music tools as they are now (spotify_play for a name, spotify_mix for a
# mood or a genre). Generic on purpose; your own phrasings, which are personal, go in data/.
# expect: every entry is called ("a|b" for either); forbid: none is. Names are substrings of tool names.
channel: satellite
cases:
  # a genre or a mood is never played as a title (Queen's album Jazz, "Drum and Bass Father")
  - say: Play some jazz.
    expect: [spotify_mix]
    forbid: [spotify_play]
  - say: Put on some drum and bass.
    expect: [spotify_mix]
    forbid: [spotify_play]
  - say: Play dnb.
    expect: [spotify_mix]
    forbid: [spotify_play]
  - say: Play something chill.
    expect: [spotify_mix]
    forbid: [spotify_play]
  - say: Something to fall asleep to.
    expect: [spotify_mix]
    forbid: [spotify_play]
  - say: Play some music.
    expect: [spotify_mix|spotify_play]
  # a name is a name
  - say: Play Daft Punk.
    expect: [spotify_play]
    forbid: [spotify_mix]
  - say: Play Get Lucky by Daft Punk.
    expect: [spotify_play]
    forbid: [spotify_mix]
  - say: Play One by U2.
    expect: [spotify_play]
    forbid: [spotify_mix]
  - say: Play my drum emoji playlist.
    expect: [spotify_play]
    forbid: [spotify_mix]
  - say: Play the album Random Access Memories.
    expect: [spotify_play]
    forbid: [spotify_mix]
  # two things at once, and late in a conversation
  - say: Play some jazz and turn on the lights.
    expect: [spotify_mix, HassTurnOn|HassLightSet]
    forbid: [spotify_play]
  - before: ["What time is it?", Play Daft Punk., Pause.]
    say: Play some drum and bass and dim the lights a bit.
    expect: [spotify_mix, HassLightSet|HassTurn]
    forbid: [spotify_play]
  # about what is playing
  - say: Who is this?
    expect: [spotify_now_playing]
  - before: [Play something chill.]
    say: Who is this?
    expect: [spotify_now_playing]
  - before: [Play something chill.]
    say: Not this one.
    expect: [spotify_next_track|spotify_mix]
    forbid: [spotify_play]
  - before: [Play something chill.]
    say: Something more upbeat.
    expect: [spotify_mix]
    forbid: [spotify_play]
  - before: [Play something chill.]
    say: Save this song.
    forbid: [spotify_play, spotify_mix, spotify_queue, HassListAddItem]
  # control
  - before: [Play Daft Punk.]
    say: Pause.
    expect: [spotify_pause]
  - before: [Play Daft Punk.]
    say: Turn it down a bit.
    expect: [spotify_volume]
    forbid: [HassSetVolume]
  - say: Stop the music in 30 minutes.
    expect: [later_add]
