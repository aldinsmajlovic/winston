# Music requests for `winston check turns --phrases tests/music_phrases.yaml --runs 10`: what the box's brain
# calls for each (`at`: the hour a request belongs to; at 13:00 sleep music got "I'm not sure what you mean"). Generic on purpose; your own phrasings, which are personal, go in data/.
# expect: every entry is called ("a|b" for either); forbid: none is. Names are substrings of tool names, and
# "tool(arg)" also needs that argument: spotify_play(what) plays a name, spotify_play(genre) a genre. The
# expectations hold for both layouts the A/B of 2026-10-16 compared (play, mix and queue as three tools, or
# one play with fields).
channel: satellite
cases:
  # a genre or a mood is never played as a title (Queen's album Jazz, "Drum and Bass Father")
  - say: Play some jazz.
    expect: ["spotify_mix|spotify_play(genre)"]
    forbid: ["spotify_play(what)"]
  - say: Put on some drum and bass.
    expect: ["spotify_mix|spotify_play(genre)"]
    forbid: ["spotify_play(what)"]
  - say: Play dnb.
    expect: ["spotify_mix|spotify_play(genre)"]
    forbid: ["spotify_play(what)"]
  - say: Play something chill.
    expect: ["spotify_mix|spotify_play(mood)|spotify_play(artists)"]
    forbid: ["spotify_play(what)"]
  - say: Something to fall asleep to.
    at: "23:30"
    expect: ["spotify_mix|spotify_play(mood)|spotify_play(artists)", spotify_sleep]
    forbid: ["spotify_play(what)", "volume"]
  - say: Play some music.
    expect: ["spotify_mix|spotify_play"]
  # a name is a name
  - say: Play Daft Punk.
    expect: ["spotify_play(what)"]
    forbid: ["spotify_mix", "spotify_play(genre)"]
  - say: Play Get Lucky by Daft Punk.
    expect: ["spotify_play(by)"]
    forbid: ["spotify_mix", "spotify_play(genre)"]
  - say: Play One by U2.
    expect: ["spotify_play(by)"]
    forbid: ["spotify_mix", "spotify_play(genre)"]
  - say: Play my drum emoji playlist.
    expect: ["spotify_play(what)"]
    forbid: ["spotify_mix", "spotify_play(genre)"]
  - say: Play the album Random Access Memories.
    expect: ["spotify_play(what)"]
    forbid: ["spotify_mix", "spotify_play(genre)"]
  - say: Play Get Lucky next.
    expect: ["spotify_queue|spotify_play(next)"]
  # two things at once, and late in a conversation
  - say: Play some jazz and turn on the lights.
    expect: ["spotify_mix|spotify_play(genre)", "HassTurnOn|HassLightSet"]
    forbid: ["spotify_play(what)"]
  - before: ["What time is it?", Play Daft Punk., Pause.]
    say: Play some drum and bass and dim the lights a bit.
    expect: ["spotify_mix|spotify_play(genre)", "HassLightSet|HassTurn"]
    forbid: ["spotify_play(what)"]
  # about what is playing
  - say: Who is this?
    expect: [spotify_now_playing]
  - before: [Play something chill.]
    say: Who is this?
    expect: [spotify_now_playing]
  - before: [Play something chill.]
    say: Not this one.
    expect: ["spotify_next_track|spotify_mix|spotify_play(mood)|spotify_play(artists)"]
    forbid: ["spotify_play(what)"]
  - before: [Play something chill.]
    say: Something more upbeat.
    expect: ["spotify_mix|spotify_play(mood)|spotify_play(artists)|spotify_play(genre)"]
    forbid: ["spotify_play(what)"]
  - before: [Play something chill.]
    say: Save this song.
    expect: ["spotify_feedback(verdict)"]
    forbid: [spotify_play, spotify_mix, spotify_queue, HassListAddItem]
  # what he thinks of it, kept
  - before: [Play something chill.]
    say: I like this one.
    expect: ["spotify_feedback(verdict)"]
    forbid: ["spotify_feedback(artist)", HassListAddItem]
  - before: [Play something chill.]
    say: Never play this song again.
    expect: ["spotify_feedback(verdict)"]
    forbid: ["spotify_feedback(artist)"]
  - say: No Elliott Smith for now.
    expect: ["spotify_feedback(artist)"]
  - before: [Play something chill.]
    say: What was the song before this?
    expect: [spotify_now_playing]
  # control
  - before: [Play Daft Punk.]
    say: Pause.
    expect: [spotify_pause]
  - before: [Play Daft Punk.]
    say: Turn it down a bit.
    expect: [spotify_volume]
    forbid: [HassSetVolume]
  - say: Stop the music in 30 minutes.
    expect: [spotify_sleep]
    forbid: [later_add]
  - say: Turn the music off in an hour.
    at: "23:30"
    expect: ["spotify_sleep(minutes)"]
    forbid: [later_add, spotify_pause]
  # music new to the user, and the newest record (step 9)
  - say: Play something new.
    expect: ["spotify_play(fresh)"]
    forbid: ["spotify_play(what)"]
  - say: Put on something I've never heard before.
    expect: ["spotify_play(fresh)"]
    forbid: ["spotify_play(what)"]
  - say: Play something chill.
    forbid: ["spotify_play(fresh)", "spotify_play(familiar)", "spotify_play(what)"]
  # music the user knows, and a correction acted on, never only promised (2026-10-18: "let me find something
  # softer", then no call; then the library read and a question instead of music)
  - say: Play something familiar.
    expect: ["spotify_play(familiar)"]
    forbid: ["spotify_play(fresh)"]
  - before: [Play something calm.]
    say: That's not very calm.
    expect: ["spotify_play(mood)|spotify_play(artists)"]
    forbid: ["spotify_play(what)", "spotify_play(fresh)"]
  - before: [Play something calm.]
    say: Something more familiar. Not these new songs.
    expect: ["spotify_play(familiar)"]
    forbid: ["spotify_play(fresh)"]
  - before: [Play something calm., That's not very calm.]
    say: Maybe a playlist I know, or something familiar.
    expect: ["spotify_play(familiar)|spotify_play(what)"]
    forbid: ["spotify_play(fresh)"]
  - say: Play the new Tame Impala album.
    expect: ["spotify_play(latest)"]
  - say: Play Fred again's latest song.
    expect: ["spotify_play(latest)"]
  - say: Play Currents by Tame Impala.
    expect: ["spotify_play(what)"]
    forbid: ["spotify_play(latest)"]
  # controls: shuffle, repeat, seek, a song to a playlist, the queue (2026-10-17)
  - {before: [Play Daft Punk.], say: Shuffle., expect: [spotify_shuffle], forbid: [spotify_play(what)]}
  - {before: [Play my running playlist.], say: Shuffle this playlist., expect: [spotify_shuffle]}
  - {say: Shuffle my liked songs., expect: [spotify_play(what), spotify_shuffle]}
  - {before: [Play Daft Punk.], say: Put this song on repeat., expect: [spotify_repeat], forbid: [spotify_play]}
  - {before: [Play Daft Punk.], say: Stop repeating., expect: [spotify_repeat]}
  - {before: [Play Daft Punk.], say: Skip ahead thirty seconds., expect: [spotify_seek], forbid: [spotify_next_track]}
  - {before: [Play Daft Punk.], say: Go back ten seconds., expect: [spotify_seek], forbid: [spotify_previous_track]}
  - {before: [Play Daft Punk.], say: Play that again., expect: [spotify_seek|spotify_previous_track], forbid: [spotify_play]}
  - {before: [Play Daft Punk.], say: Start this song from the beginning., expect: [spotify_seek|spotify_previous_track]}
  - {before: [Play Daft Punk.], say: Add this song to my running playlist., expect: [spotify_feedback(playlist)], forbid: [spotify_play]}
  - {before: [Play Daft Punk.], say: Put this in my drum emoji playlist., expect: [spotify_feedback(playlist)], forbid: [spotify_play]}
  - {before: [Play Daft Punk.], say: Save this song., expect: [spotify_feedback], forbid: [spotify_feedback(playlist)]}
  - {before: [Play Daft Punk.], say: 'What''s next?', expect: [spotify_now_playing]}
  - {before: [Play Daft Punk.], say: Clear the queue., forbid: [spotify_play, spotify_next_track]}
  - {before: [Play Daft Punk.], say: Skip., expect: [spotify_next_track], forbid: [spotify_seek]}
  - {before: [Play Daft Punk.], say: Go back to the last song., expect: [spotify_previous_track], forbid: [spotify_seek]}
  - {before: [Play Daft Punk.], say: Add Get Lucky to the queue., expect: [spotify_play(next)]}
  - {before: [Play Daft Punk.], say: Stop playing., expect: [spotify_pause]}
  - {before: [Play Daft Punk.], say: Keep playing., expect: [spotify_resume]}
