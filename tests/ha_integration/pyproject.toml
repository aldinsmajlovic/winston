[project]
name = "winston-ha-integration-tests"
version = "0"
description = "Tests for custom_components/winston in Home Assistant's own test kit (its own venv: Home Assistant pins its own versions)."
requires-python = ">=3.14.2"
dependencies = ["pytest-homeassistant-custom-component==0.13.375"]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["."]
