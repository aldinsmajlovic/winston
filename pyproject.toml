[project]
name = "winston"
version = "0.1.0"
description = "Self-hosted, full-duplex voice assistant for Home Assistant"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pipecat-ai[webrtc,silero,openai]>=1.11.0",
    "pipecat-ai-prebuilt",
    "onnx-asr[cpu,hub]>=0.12.0",
    "mcp>=1.10",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "typer>=0.12",
    "docker>=7.0",
    "google-genai>=2.25",
    "claude-agent-sdk>=0.2.158",
    "discord-py>=2.7.1",
    "aioesphomeapi>=46.5",
    "winston-sdk",
]

[project.scripts]
winston = "winston.cli.main:app"

# Built-in plugins register through the same entry points third-party packages use.
[project.entry-points."winston.stt"]
parakeet = "winston.plugins.stt.parakeet:Parakeet"
openai_transcription = "winston.plugins.stt.openai_transcription:OpenAITranscription"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/winston"]

# The extension SDK is its own package (sdk/), so an extension needs none of the voice stack.
[tool.uv.workspace]
members = ["sdk"]

[tool.uv.sources]
winston-sdk = { workspace = true }

[tool.ruff]
line-length = 110
target-version = "py312"
