[project]
name = "winston"
version = "0.1.0"
description = "Self-hosted full-duplex voice assistant for Home Assistant"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pipecat-ai[webrtc,silero,openai]>=1.11.0",
    "pipecat-ai-prebuilt",
    "onnx-asr[cpu,hub]>=0.12.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "mcp>=1.10",
]

[tool.uv]
package = false
