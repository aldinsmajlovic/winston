version: 2
assistant:
  name: Winston
  persona: persona.md

engines:
  llm:
    driver: docker
    image: ghcr.io/ggml-org/llama.cpp:server-cuda-v1.0.0-b12359-b1b770d
    port: 8000
    health: /health
    startup_timeout: 900
    gpu: true
    runtime: nvidia            # explicit: this host's CDI spec is stale, see docs/decisions.md
    env:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      ~/.cache/huggingface: /root/.cache/huggingface   # llama.cpp reads the HF cache
    args:
      - -hf
      - "{model}"                # the brain's model (llm.model below), so it is set in one place
      - --alias
      - "{model}"
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - -ngl
      - "99"
      - -fa
      - "on"
      - -c
      - "{llm.context_both}"     # llm.context per slot (-np 2): his prompt alone is 10.5k
      - -np
      - "2"
      - -ctk
      - q8_0
      - -ctv
      - q8_0
      - --no-mmproj              # text only; the vision projector is another 0.9 GB
      - --jinja
      - --cache-ram
      - "2048"
      - --spec-type              # the GGUF's own MTP layer: 44 -> 60-80 tokens/s
      - draft-mtp
      - --spec-draft-n-max
      - "2"
  tts:
    driver: subprocess
    port: 8880
    health: /health
    startup_timeout: 300
    cwd: "{repo}/services/tts-breeze2"
    cmd:
      - "{repo}/services/tts-breeze2/.venv/bin/python"
      - server.py
      - --voice
      - "{data}/voices/librivox/minter_card2_aged.wav"   # any clip under {data}/voices; see docs/voices.md
      - --voices-dir
      - "{data}/voices"
      - --port
      - "8880"
      - --fast
      - backbone_decode
      - depth_decoder
      - codec
      - --text-encoder-bits
      - "8"

llm:
  provider: openai_compatible
  base_url: http://127.0.0.1:8000/v1
  model: unsloth/Qwen3.8-27B-GGUF:UD-Q4_K_S
  sampling: {temperature: 0.3, top_p: 0.8, presence_penalty: 0.0, max_tokens: 512}
  thinking: {spoken: home, typed: always, home_effort: medium, control: chat_template}   # control: reasoning_effort for Ollama, none for hosted

stt: {provider: parakeet, model: FluidVoice-Labs/fluid-speech-pro-onnx, quantization: int8}
tts:
  {provider: openai_speech, base_url: http://127.0.0.1:8880/v1, voice: librivox/minter_card2_aged, sample_rate: 24000,
   streaming: {enabled: true, chunk_secs: 1.6, first_secs: 0.96, lookahead_secs: 0.32}}   # Breeze TTS 2; streaming applies to Chatterbox
vad: {provider: silero, stop_secs: 0.3, unfinished_stop_secs: 2.5}

channels:
  voice: {enabled: true, host: 127.0.0.1, port: 7860}
  discord: {enabled: false}
  satellite:
    enabled: false             # Voice PE boxes; see docs/voice-pe.md
    devices: {}                # room: {host: ..., key_env: VOICE_PE_KEY, wake_word: hey_jarvis, area: Living Room,
                               #        wake_sensitivity: Moderately sensitive}; docs/rooms.md, docs/voice-pe.md

providers:
  home_assistant:
    enabled: true              # false keeps these settings without using Home Assistant
    url: http://homeassistant.local:8123
    token_env: HA_TOKEN
    mcp_path: /api/mcp
    expose_domains: [person, weather, todo]
    expose: {}                 # entity_id: {name: ..., aliases: [...]}; see docs/running.md

memory: {dir: memory, commit_on_write: true}
logging: {tool_calls: logs/tool_calls.jsonl, latency: logs/latency.jsonl}
control: {host: 127.0.0.1, port: 8700}
