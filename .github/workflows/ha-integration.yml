# Winston's Home Assistant integration (custom_components/winston, docs/ha-integration.md): Home Assistant's
# own check of it (hassfest), the Marketplace's and HACS's (the same check), and its tests in Home Assistant's
# test kit (tests/ha_integration, its own venv).
name: Home Assistant integration

on:
  push:
    branches: [main]
    paths: ["custom_components/**", "hacs.json", "tests/ha_integration/**", ".github/workflows/ha-integration.yml"]
  pull_request:
    paths: ["custom_components/**", "hacs.json", "tests/ha_integration/**", ".github/workflows/ha-integration.yml"]

permissions: {}

jobs:
  hassfest:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: home-assistant/actions/hassfest@9e9565e68f5a70d874202871f4c4064d23814235  # master, 2026-11-23

  hacs:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: hacs/action@d556e736723344f83838d08488c983a15381059a  # 22.5.0
        with:
          category: integration

  tests:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
      - name: Tests in Home Assistant's test kit
        run: uv run --python 3.14 pytest -q
        working-directory: tests/ha_integration
