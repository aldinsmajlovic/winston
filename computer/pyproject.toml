[project]
name = "winston-computer"
version = "0.1.0"
description = "A small MCP server for each computer Winston reaches: open things, status, logs and waiting updates"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3",
    "psutil>=7",
]

[project.scripts]
winston-computer = "winston_computer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/winston_computer"]

[tool.ruff]
line-length = 110
target-version = "py311"
